# Cloudflare TLS 部署覆盖层：不启动 certbot。
#
# 用法（deploy/prod）：
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#
# 说明：
# - HTTPS 由 Cloudflare 终结（Flexible / Full / Full (strict)），本机无需 ACME 续期。
# - Flexible：OMNINEST_HTTPS_ENABLED=false，源站只监听 80 即可。
# - Full / Full (strict)：在 Cloudflare 下载 Origin Certificate，挂到 nginx 后开启 HTTPS
#   （见本文件 nginx.volumes 示例，按需取消注释）。
# - certbot 服务通过 profile 隔离，默认永不启动。

services:
  certbot:
    profiles:
      - certbot-disabled-by-cloudflare

  nginx:
    environment:
      # Cloudflare Flexible 保持 false；Full/Full strict 改为 true 并挂载源站证书。
      OMNINEST_HTTPS_ENABLED: ${OMNINEST_HTTPS_ENABLED:-false}
      # 若走 Cloudflare Flexible，健康检查仍可用 HTTP；无需 certbot 证书目录。
    # volumes 示例（Full / Full strict）：
    # volumes:
    #   - ./cloudflare/origin.crt:/etc/ssl/certs/omninest/origin.crt:ro
    #   - ./cloudflare/origin.key:/etc/ssl/private/omninest/origin.key:ro
    #   - omninest-certbot-challenges:/var/www/certbot:ro

  # Cloudflare 回源到本机 80/443；MinIO 公网地址按 CF 域名配置，例如：
  # OMNINEST_MINIO_PUBLIC_ENDPOINT=https://cdn.example.com
  backend-api:
    environment:
      OMNINEST_MINIO_PUBLIC_ENDPOINT: ${OMNINEST_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
