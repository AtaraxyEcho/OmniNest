name: omninest

x-backend-environment: &backend-environment
  OMNINEST_PROFILE: prod
  OMNINEST_SERVER_PORT: "8080"
  OMNINEST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-omninest}
  OMNINEST_DB_USER: ${POSTGRES_USER:-omninest}
  OMNINEST_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须显式配置}
  # 小内存机连接池上限（Spring 原生绑定）；API 可在角色环境中覆盖。
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL:-8}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${HIKARI_MIN_IDLE:-1}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT:-30000}
  OMNINEST_REDIS_HOST: redis
  OMNINEST_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 生产必须非空}
  OMNINEST_RABBITMQ_HOST: rabbitmq
  OMNINEST_RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-omninest}
  OMNINEST_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS 必须显式配置}
  OMNINEST_SECURITY_JWT_SECRET: ${OMNINEST_SECURITY_JWT_SECRET:?OMNINEST_SECURITY_JWT_SECRET 必须显式配置}
  OMNINEST_SECURITY_CREDENTIAL_ENCRYPTION_KEY: ${OMNINEST_SECURITY_CREDENTIAL_ENCRYPTION_KEY:-}
  OMNINEST_HTTPS_ENABLED: ${OMNINEST_HTTPS_ENABLED:?请在 .env 显式设置 OMNINEST_HTTPS_ENABLED（公网部署必须 true）}
  OMNINEST_SECURITY_REFRESH_COOKIE_SAME_SITE: ${OMNINEST_SECURITY_REFRESH_COOKIE_SAME_SITE:-STRICT}
  OMNINEST_SECURITY_REGISTRATION_ENABLED: ${OMNINEST_SECURITY_REGISTRATION_ENABLED:-false}
  OMNINEST_SECURITY_TRUSTED_PROXIES: ${OMNINEST_SECURITY_TRUSTED_PROXIES:-${OMNINEST_NGINX_INTERNAL_IP:-172.30.0.10}}
  OMNINEST_SECURITY_ALLOWED_ORIGINS: ${OMNINEST_SECURITY_ALLOWED_ORIGINS:-http://localhost:3000}
  OMNINEST_SETUP_ENABLED: ${OMNINEST_SETUP_ENABLED:-true}
  OMNINEST_SETUP_PERSISTENT_STATE_ENABLED: ${OMNINEST_SETUP_PERSISTENT_STATE_ENABLED:-true}
  OMNINEST_SETUP_TWOFACTORREQUIRED: ${OMNINEST_SETUP_TWOFACTORREQUIRED:-false}
  OMNINEST_SETUP_TOKEN: ${OMNINEST_SETUP_TOKEN:-}
  OMNINEST_SETUP_WEB_BASE_URL: ${OMNINEST_SETUP_WEB_BASE_URL:-}
  OMNINEST_MINIO_ENDPOINT: http://minio:9000
  OMNINEST_MINIO_PUBLIC_ENDPOINT: ${OMNINEST_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  OMNINEST_MINIO_DOCKER_ENDPOINT: http://minio:9000
  OMNINEST_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须显式配置}
  OMNINEST_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须显式配置}
  OMNINEST_LOCAL_MEDIA_ENABLED: ${OMNINEST_LOCAL_MEDIA_ENABLED:-true}
  OMNINEST_LOCAL_MEDIA_ROOT: /mnt/local-media
  OMNINEST_LOCAL_MEDIA_PROCESS_ROOT: /mnt/local-media
  # 4C4G 个人自托管默认关闭 ClamAV；启用扫描时设 true 并 COMPOSE_PROFILES=clamav。
  OMNINEST_CLAMAV_ENABLED: ${OMNINEST_CLAMAV_ENABLED:-false}
  OMNINEST_CLAMAV_HOST: clamav
  OMNINEST_CLAMAV_PORT: "3310"
  OMNINEST_RCLONE_ENDPOINT: http://rclone:5572
  OMNINEST_RCLONE_RC_USER: ${RCLONE_RC_USER:-admin}
  OMNINEST_RCLONE_RC_PASS: ${RCLONE_RC_PASS:?RCLONE_RC_PASS 必须显式配置}
  OMNINEST_RCLONE_LOCAL_HOST_PATH: /mnt/local
  OMNINEST_RCLONE_IMPORT_HOST_PATH: /mnt/imports
  OMNINEST_RCLONE_IMPORT_CONTAINER_PATH: /mnt/imports
  OMNINEST_AI_SIDECAR_SECRET: ${OMNINEST_AI_SIDECAR_SECRET:?OMNINEST_AI_SIDECAR_SECRET 必须显式配置}
  OMNINEST_SEARCH_INDEX_PATH: /var/lib/omninest/lucene
  OMNINEST_SEARCH_PHOTO_INDEX_PATH: /var/lib/omninest/lucene-photo
  # GeoNames 离线逆地理编码数据集目录（omninest-geonames 卷；放入 dump 文件并重启即可自动导入）。
  OMNINEST_GEO_IMPORT_DIR: ${OMNINEST_GEO_IMPORT_DIR:-/var/lib/omninest/geonames}
  OMNINEST_NETEASE_API_BASE_URL: http://netease-music-api:3000
  OMNINEST_PHOTO_AI_ENDPOINT: http://vision-sidecar:8090
  OMNINEST_PHOTO_AI_TIMEOUT_SECONDS: ${OMNINEST_PHOTO_AI_TIMEOUT_SECONDS:-30}
  OMNINEST_PHOTO_AI_MAX_IMAGE_BYTES: ${OMNINEST_PHOTO_AI_MAX_IMAGE_BYTES:-67108864}
  OMNINEST_PHOTO_AI_MAX_RESPONSE_BYTES: ${OMNINEST_PHOTO_AI_MAX_RESPONSE_BYTES:-1048576}
  OMNINEST_MUSICBRAINZ_USER_AGENT: ${OMNINEST_MUSICBRAINZ_USER_AGENT:-OmniNest/0.1.0 (contact@example.com)}
  OMNINEST_READER_COMIC_CONSUME_IN_API: "false"
  # 容器内应用日志路径（相对工作目录 /app）
  OMNINEST_LOG_PATH: ${OMNINEST_LOG_PATH:-logs/omninest.log}
  TZ: Asia/Shanghai

# 4C4G 无 ClamAV：JVM 使用显式堆上限（见各 backend 角色 JAVA_OPTS）。

# 容器 stdout 日志轮转上限；应用文件日志由 logback rollingpolicy（50MB/14天/512MB）治理。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-service: &backend-service
  image: ${OMNINEST_BACKEND_IMAGE:-omninest/backend}:${OMNINEST_IMAGE_TAG:-0.1.0}
  build:
    context: ../../backend
    dockerfile: ../deploy/backend/Dockerfile
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - omninest-search:/var/lib/omninest/lucene
    - omninest-search-photo:/var/lib/omninest/lucene-photo
    - omninest-geonames:/var/lib/omninest/geonames
    - omninest-rclone-local:/mnt/local
    - omninest-rclone-imports:/mnt/imports
    - ${OMNINEST_LOCAL_MEDIA_ROOT:-../.omninest/local-media}:/mnt/local-media:ro
  # 后端是 rclone RC 的唯一调用方（见 x-backend-environment 的 OMNINEST_RCLONE_ENDPOINT），
  # 因此只有它同时挂在出网执行体所在的 egress 上；数据面服务与 nginx 都不进 egress。
  networks:
    - default
    - egress
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 60s
  logging: *default-logging

services:
  nginx:
    image: ${OMNINEST_NGINX_IMAGE:-omninest/nginx}:${OMNINEST_IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deploy/prod/nginx/Dockerfile
      args:
        WEB_BASE_HREF: ${OMNINEST_WEB_BASE_HREF:-/}
    environment:
      OMNINEST_HTTPS_ENABLED: ${OMNINEST_HTTPS_ENABLED:?请在 .env 显式设置 OMNINEST_HTTPS_ENABLED（公网部署必须 true）}
      OMNINEST_PUBLIC_HOST: ${OMNINEST_PUBLIC_HOST:-localhost}
      OMNINEST_PUBLIC_HTTP_PORT: ${OMNINEST_PUBLIC_HTTP_PORT:-80}
      OMNINEST_PUBLIC_HTTPS_PORT: ${OMNINEST_PUBLIC_HTTPS_PORT:-443}
      OMNINEST_PUBLIC_MINIO_PORT: ${MINIO_API_PORT:-9000}
      OMNINEST_SECURITY_ALLOWED_ORIGINS: ${OMNINEST_SECURITY_ALLOWED_ORIGINS:-http://localhost:3000}
      OMNINEST_WEB_BASE_HREF: ${OMNINEST_WEB_BASE_HREF:-/}
      OMNINEST_SETUP_WEB_BASE_URL: ${OMNINEST_SETUP_WEB_BASE_URL:-}
      OMNINEST_MINIO_PUBLIC_ENDPOINT: ${OMNINEST_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      CERTBOT_CERT_NAME: ${CERTBOT_CERT_NAME:-omninest}
      CERTBOT_RELOAD_INTERVAL_SECONDS: ${CERTBOT_RELOAD_INTERVAL_SECONDS:-15}
      TZ: Asia/Shanghai
    depends_on:
      backend-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${OMNINEST_PUBLIC_HTTP_PORT:-80}:80"
      - "${OMNINEST_PUBLIC_HTTPS_PORT:-443}:443"
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - omninest-certbot-config:/etc/letsencrypt:ro
      - omninest-certbot-challenges:/var/www/certbot:ro
    networks:
      default:
        ipv4_address: ${OMNINEST_NGINX_INTERNAL_IP:-172.30.0.10}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    restart: unless-stopped
    logging: *default-logging

  # 默认不启动。使用 Let's Encrypt 时：COMPOSE_PROFILES=certbot
  certbot:
    profiles:
      - certbot
    image: certbot/certbot:v5.4.0
    entrypoint: ["/bin/sh", "/opt/omninest/entrypoint.sh"]
    environment:
      OMNINEST_HTTPS_ENABLED: ${OMNINEST_HTTPS_ENABLED:?请在 .env 显式设置 OMNINEST_HTTPS_ENABLED（公网部署必须 true）}
      OMNINEST_PUBLIC_HOST: ${OMNINEST_PUBLIC_HOST:-localhost}
      OMNINEST_PUBLIC_HTTP_PORT: ${OMNINEST_PUBLIC_HTTP_PORT:-80}
      CERTBOT_IDENTIFIER_TYPE: ${CERTBOT_IDENTIFIER_TYPE:-domain}
      CERTBOT_CERT_NAME: ${CERTBOT_CERT_NAME:-omninest}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-false}
      CERTBOT_RENEW_INTERVAL_SECONDS: ${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
      CERTBOT_RETRY_INTERVAL_SECONDS: ${CERTBOT_RETRY_INTERVAL_SECONDS:-900}
      TZ: Asia/Shanghai
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ./certbot/entrypoint.sh:/opt/omninest/entrypoint.sh:ro
      - omninest-certbot-config:/etc/letsencrypt
      - omninest-certbot-challenges:/var/www/certbot
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  backend-api:
    <<: *backend-service
    environment:
      <<: *backend-environment
      OMNINEST_ROLE: api
      # 4C4G：显式堆上限；不设 MaxMetaspaceSize，由 mem_limit 约束，避免 Boot4 启动期 Metaspace OOM。
      JAVA_OPTS: ${JAVA_OPTS_API:--Xms128m -Xmx512m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -XX:+UseCompactObjectHeaders}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_API:-10}
    ports:
      - "127.0.0.1:${OMNINEST_SERVER_PORT:-8080}:8080"
    mem_limit: ${BACKEND_API_MEM_LIMIT:-768m}

  backend-worker:
    <<: *backend-service
    environment:
      <<: *backend-environment
      OMNINEST_ROLE: worker
      JAVA_OPTS: ${JAVA_OPTS_WORKER:--Xms128m -Xmx512m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -XX:+UseCompactObjectHeaders}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_WORKER:-6}
      OMNINEST_WORKER_FILE_INDEX_CONCURRENCY: "1"
      OMNINEST_WORKER_TEXT_EXTRACTION_CONCURRENCY: "1"
      OMNINEST_WORKER_MEDIA_CONCURRENCY: "1"
    mem_limit: ${BACKEND_WORKER_MEM_LIMIT:-768m}

  backend-scheduler:
    <<: *backend-service
    environment:
      <<: *backend-environment
      OMNINEST_ROLE: scheduler
      JAVA_OPTS: ${JAVA_OPTS_SCHEDULER:--Xms64m -Xmx192m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -XX:+UseCompactObjectHeaders}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SCHEDULER:-4}
    mem_limit: ${BACKEND_SCHEDULER_MEM_LIMIT:-512m}

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omninest}
      POSTGRES_USER: ${POSTGRES_USER:-omninest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须显式配置}
      TZ: Asia/Shanghai
    # 4C4G：降低 PG 缓冲与连接数，避免与 JVM 抢内存。
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-512MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - omninest-postgres:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 生产必须非空}
      TZ: Asia/Shanghai
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - omninest-redis:/data
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-omninest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS 必须显式配置}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 10
    volumes:
      - omninest-rabbitmq:/var/lib/rabbitmq
    mem_limit: ${RABBITMQ_MEM_LIMIT:-320m}
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    # 双挂：default 保住宿主回环发布的 9001 与 nginx 反代的 9000，media 让独占 internal 网的
    # ffmpeg 能取预签名地址。只挂 internal 会让发布端口静默失效（实测 Ports 为空）。
    networks:
      - default
      - media
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须显式配置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须显式配置}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - omninest-minio:/data
    mem_limit: ${MINIO_MEM_LIMIT:-320m}
    restart: unless-stopped
    logging: *default-logging

  ffmpeg:
    image: jrottenberg/ffmpeg:8-alpine
    container_name: omninest-ffmpeg
    # 不发布任何端口，因此可以只挂 internal 的 media（见 networks 段的说明）。
    networks:
      - media
    environment:
      TZ: Asia/Shanghai
    entrypoint: ["sh", "-c", "while true; do sleep 86400; done"]
    healthcheck:
      test: ["CMD-SHELL", "ffmpeg -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - omninest-probe-tmp:/tmp/probe
      - omninest-transcode-tmp:/tmp/transcode
      - ${OMNINEST_LOCAL_MEDIA_ROOT:-../.omninest/local-media}:/mnt/local-media:ro
    mem_limit: ${FFMPEG_MEM_LIMIT:-128m}
    restart: unless-stopped
    logging: *default-logging

  # 4C4G 默认不启动。启用：COMPOSE_PROFILES=clamav
  # 且 .env 设 OMNINEST_CLAMAV_ENABLED=true；否则上传会按扫描失败处理。
  clamav:
    profiles:
      - clamav
    # 以 digest 固定 stable 标签；升级时重新解析并替换。
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    environment:
      CLAMD_CONF_StreamMaxLength: ${CLAMD_CONF_StreamMaxLength:-2047M}
      CLAMD_CONF_MaxScanSize: ${CLAMD_CONF_MaxScanSize:-2047M}
      CLAMD_CONF_MaxFileSize: ${CLAMD_CONF_MaxFileSize:-2047M}
      CLAMD_CONF_MaxScanTime: ${CLAMD_CONF_MaxScanTime:-1800000}
      CLAMD_CONF_ReadTimeout: ${CLAMD_CONF_ReadTimeout:-1800}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 6m
      retries: 10
    volumes:
      - omninest-clamav-db:/var/lib/clamav
    mem_limit: ${CLAMAV_MEM_LIMIT:-1536m}
    restart: unless-stopped
    logging: *default-logging

  netease-music-api:
    image: ${OMNINEST_NETEASE_IMAGE:-omninest-netease-music-api}:${OMNINEST_IMAGE_TAG:-0.1.0}
    build: ../netease-api
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(response => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: ${NETEASE_MEM_LIMIT:-128m}
    restart: unless-stopped
    logging: *default-logging

  rclone:
    image: rclone/rclone:1.74.2
    environment:
      RCLONE_RC_PASS: ${RCLONE_RC_PASS:?RCLONE_RC_PASS 必须显式配置}
      RCLONE_RC_USER: ${RCLONE_RC_USER:-admin}
      TZ: Asia/Shanghai
    # 出网执行体只在 egress。外部存储的 S3/MINIO endpoint 默认已被
    # ExternalStorageEndpointGuard 拒内网；即便管理员打开 allow-private-network，
    # 这张网上也没有通往数据面的路由，最坏只能打它本来就够得到的公网。
    networks:
      - egress
    command: >
      rcd
      --rc-addr 0.0.0.0:5572
      --rc-job-expire-duration 5m
      --rc-server-read-timeout 1h
      --rc-server-write-timeout 1h
      --rc-enable-metrics
      --log-level INFO
    volumes:
      - omninest-rclone:/config/rclone
      - omninest-rclone-local:/mnt/local
      - omninest-rclone-imports:/mnt/imports
    healthcheck:
      test: ["CMD-SHELL", "rclone rc rc/noop --rc-addr 127.0.0.1:5572 --rc-user \"$$RCLONE_RC_USER\" --rc-pass \"$$RCLONE_RC_PASS\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${RCLONE_MEM_LIMIT:-96m}
    restart: unless-stopped
    logging: *default-logging

  # 4C4G 默认不启动照片 AI。启用：COMPOSE_PROFILES=photo-ai
  # 默认 lightweight + RapidOCR 常驻 RSS < 160MB；切换 ram_plus_int8 时必须同时
  # 把 AI_SIDECAR_MEM_LIMIT 调到 2560m 以上，侧车也会在容器限额 < 2GB 时自动降级。
  vision-sidecar:
    profiles:
      - photo-ai
    build:
      context: ../vision-sidecar
      dockerfile: Dockerfile
    environment:
      AI_VISION_PROFILE: ${AI_VISION_PROFILE:-lightweight}
      AI_ORT_INTRA_THREADS: ${AI_CPU_THREADS:-1}
      OMNINEST_AI_SIDECAR_SECRET: ${OMNINEST_AI_SIDECAR_SECRET:?OMNINEST_AI_SIDECAR_SECRET 必须显式配置}
      OMP_NUM_THREADS: ${AI_CPU_THREADS:-1}
      TZ: Asia/Shanghai
    volumes:
      - omninest-ai-models:/app/models
    mem_limit: ${AI_SIDECAR_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging: *default-logging

volumes:
  omninest-postgres:
  omninest-redis:
  omninest-rabbitmq:
  omninest-minio:
  omninest-clamav-db:
  omninest-rclone:
  omninest-rclone-local:
  omninest-rclone-imports:
  omninest-ai-models:
  omninest-search:
  omninest-search-photo:
  omninest-geonames:
  omninest-certbot-config:
  omninest-certbot-challenges:
  omninest-probe-tmp:
  omninest-transcode-tmp:

networks:
  default:
    ipam:
      config:
        - subnet: ${OMNINEST_DOCKER_SUBNET:-172.30.0.0/24}
          ip_range: ${OMNINEST_DOCKER_DYNAMIC_IP_RANGE:-172.30.0.128/25}
  # 出网执行体专用网：rclone 与后端三角色。不设 internal（它们必须能出公网），
  # 但除后端外没有任何成员能路由到数据面——跨 user-defined 网络不互通也不解析（已实测）。
  egress:
    ipam:
      config:
        - subnet: ${OMNINEST_EGRESS_SUBNET:-172.31.0.0/24}
          ip_range: ${OMNINEST_EGRESS_DYNAMIC_IP_RANGE:-172.31.0.128/25}
  # ffmpeg 独占的 internal 网：容器模式下的探测/转码/截帧把预签名地址交给 `docker exec omninest-ffmpeg`，
  # 而媒体内容里内嵌的远程引用（HLS/DASH 分片、concat 列表）是 ffmpeg 自己去取的，任何提交前的地址校验
  # 都覆盖不到那批地址。这张网没有公网路由也不解析数据面服务名 ⇒ 二级出网在拓扑层封死；
  # 顶层预签名地址靠 minio 双挂本网仍可达。internal 与发布端口互斥，所以挂进来的服务不得只靠本网发布端口。
  media:
    internal: true
    ipam:
      config:
        - subnet: ${OMNINEST_MEDIA_SUBNET:-172.33.0.0/24}
          ip_range: ${OMNINEST_MEDIA_DYNAMIC_IP_RANGE:-172.33.0.128/25}
