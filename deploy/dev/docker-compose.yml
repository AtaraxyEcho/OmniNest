name: omninest-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: omninest-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omninest}
      POSTGRES_USER: ${POSTGRES_USER:-omninest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omninest}
      TZ: Asia/Shanghai
    ports:
      # 默认仅本机回环；局域网实机验收在 dev .env 设 OMNINEST_DEV_BIND=0.0.0.0 或本机局域网 IP
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - omninest-postgres:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: omninest-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: omninest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-omninest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-omninest}
      TZ: Asia/Shanghai
    ports:
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:5672:5672"
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    volumes:
      - omninest-rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: omninest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:9000:9000"
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - omninest-minio:/data
    restart: unless-stopped

  aria2:
    # 以 digest 固定（上游只发布 latest 标签），与 prod 保持一致；升级时重新解析并替换。
    image: p3terx/aria2-pro@sha256:086d1a37c586edb07ec0fb956bf9edd89d1d38d138ad5309ff96d510c8c9a011
    container_name: omninest-aria2
    environment:
      RPC_SECRET: ${RPC_SECRET:-omninest}
      RPC_PORT: 6800
      LISTEN_PORT: 6888
      TZ: Asia/Shanghai
    ports:
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:6800:6800"
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:6888:6888"
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:6888:6888/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --output /dev/null http://127.0.0.1:$${RPC_PORT}/jsonrpc"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ../../.omninest/aria2:/downloads
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: omninest-clamav
    # 可选服务：默认通过 .env 的 COMPOSE_PROFILES=clamav 启动；
    # 不启动时必须同步把 backend/.env 的 OMNINEST_CLAMAV_ENABLED 改为 false，
    # 否则后端因扫描不可用 fail-closed，上传会被拒绝。
    profiles: ["clamav"]
    environment:
      CLAMD_CONF_StreamMaxLength: ${CLAMD_CONF_StreamMaxLength:-2047M}
      CLAMD_CONF_MaxScanSize: ${CLAMD_CONF_MaxScanSize:-2047M}
      CLAMD_CONF_MaxFileSize: ${CLAMD_CONF_MaxFileSize:-2047M}
      CLAMD_CONF_MaxScanTime: ${CLAMD_CONF_MaxScanTime:-1800000}
      CLAMD_CONF_ReadTimeout: ${CLAMD_CONF_ReadTimeout:-1800}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 6m
      retries: 5
    volumes:
      - omninest-clamav-db:/var/lib/clamav
    restart: unless-stopped

  netease-music-api:
    build: ../netease-api
    container_name: omninest-netease-music-api
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:3001:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(response => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  ffmpeg:
    image: jrottenberg/ffmpeg:8-alpine
    container_name: omninest-ffmpeg
    environment:
      TZ: Asia/Shanghai
    entrypoint: ["sh", "-c", "while true; do sleep 86400; done"]
    healthcheck:
      test: ["CMD-SHELL", "ffmpeg -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - omninest-probe-tmp:/tmp/probe
      - omninest-transcode-tmp:/tmp/transcode
      - ${OMNINEST_LOCAL_MEDIA_ROOT:-../../.omninest/local-media}:/mnt/local-media:ro
    restart: unless-stopped

  rclone:
    image: rclone/rclone:1.74.2
    container_name: omninest-rclone
    # 凭据只经环境（RCLONE_<FLAG> 等价于命令行开关）下发：写在 command: 里
    # 会留在容器 argv（ps、docker inspect）中，与 prod 保持同一形态。
    environment:
      RCLONE_RC_PASS: ${RCLONE_RC_PASS:?RCLONE_RC_PASS 必须显式配置}
      RCLONE_RC_USER: ${RCLONE_RC_USER:-admin}
      TZ: Asia/Shanghai
    command: >
      rcd
      --rc-addr 0.0.0.0:5572
      --rc-job-expire-duration 5m
      --rc-server-read-timeout 1h
      --rc-server-write-timeout 1h
      --rc-enable-metrics
      --log-level INFO
    ports:
      - "${OMNINEST_DEV_BIND:-127.0.0.1}:5572:5572"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rclone rc core/version
          --url http://127.0.0.1:5572
          --user "$${RCLONE_RC_USER}"
          --pass "$${RCLONE_RC_PASS}" >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - omninest-rclone:/config/rclone
      - ../../.omninest/local-files:/mnt/local
      - ../../.omninest/rclone-imports:/mnt/imports
    restart: unless-stopped

  ai-sidecar:
    build:
      context: ../ai-sidecar
      dockerfile: Dockerfile
    container_name: omninest-ai-sidecar
    environment:
      INSIGHTFACE_ROOT: /app/models/insightface
      INSIGHTFACE_MODEL_SHA256: ${INSIGHTFACE_MODEL_SHA256:-}
      OMNINEST_AI_SIDECAR_SECRET: ${OMNINEST_AI_SIDECAR_SECRET:-change-me-ai-sidecar-random-secret}
      OMP_NUM_THREADS: ${AI_CPU_THREADS:-2}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - omninest-ai-models:/app/models
    restart: unless-stopped

volumes:
  omninest-postgres:
  omninest-rabbitmq:
  omninest-minio:
  omninest-probe-tmp:
  omninest-transcode-tmp:
  omninest-rclone:
  omninest-ai-models:
  omninest-clamav-db:
