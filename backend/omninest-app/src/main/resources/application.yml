logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

server:
  shutdown: graceful

spring:
  application:
    name: omninest
  # 项目仅通过 RedisTemplate 使用 Redis，不存在 Spring Data Redis Repository，排除后避免多数据模块仓库扫描噪音
  autoconfigure:
    exclude: org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${OMNINEST_PROFILE:dev}
  jpa:
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: OmniNestHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    schemas: omni
    default-schema: omni
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true
  rabbitmq:
    port: 5672
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-retries: 3
  data:
    redis:
      port: 6379
      database: 0
      timeout: 3s
      connect-timeout: 3s
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
  threads:
    virtual:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

photo:
  batch-download:
    max-files: 1000
    max-single-file-bytes: 536870912
    max-source-bytes: 21474836480
    min-free-bytes: 536870912
  media-limits:
    max-standard-file-bytes: 134217728
    max-raw-file-bytes: 536870912
    max-width: 30000
    max-height: 30000
    max-pixels: 100000000
    max-decoded-bytes: 419430400

file:
  transfer-limits:
    max-files-per-task: 10000

reader:
  archive-limits:
    max-archive-bytes: 2147483648
    max-entries: 20000
    max-entry-bytes: 67108864
    max-total-uncompressed-bytes: 4294967296
    max-compression-ratio: 200.0
    compression-ratio-check-threshold-bytes: 1048576

omninest:
  runtime:
    role: ${OMNINEST_ROLE:api}
  music:
    history-retention-days: 90
  setup:
    # 占位符桥接：.env 以 properties 形式导入时大写下划线键对 @ConfigurationProperties 宽松绑定不可靠，
    # 经精确占位符同时覆盖 .env、真实环境变量与缺省值三种来源。
    two-factor-required: ${OMNINEST_SETUP_TWOFACTORREQUIRED:false}
  task:
    outbox:
      enabled: true
      interval-millis: 500
      batch-size: 100
      lease-seconds: 30
      confirm-timeout-millis: 2000
      instance-id: ${random.uuid}
  file-purge:
    stale-heartbeat-seconds: 120
    recovery-interval-millis: 30000
  sync:
    outbox:
      enabled: true
      interval-millis: 500
      batch-size: 100
      lease-seconds: 30
      confirm-timeout-millis: 2000
      instance-id: ${random.uuid}
    retention:
      enabled: true
      days: 30
      cleanup-cron: 0 15 2 * * *
    realtime:
      session-audit-millis: 10000
      authentication-timeout-millis: 15000
      max-sessions-per-instance: 500
  security:
    credential-encryption-key-version: 1
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    allow-credentials: true
    content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' http: https: ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
    permissions-policy: "camera=(), microphone=(), geolocation=(), payment=()"
  worker:
    runtime:
      instance-id: ${random.uuid}
      heartbeat-interval: PT15S
      heartbeat-ttl: PT45S
      probe-timeout: PT3S
    file-index-concurrency: 1
    text-extraction-concurrency: 2
    media-concurrency: 1
  messaging:
    rabbit:
      maximum-message-bytes: 1048576
      message-ttl: 7d
      consumer-prefetch: 10
      backlog-monitoring-enabled: true
      backlog-warning-messages: 10000
      backlog-critical-messages: 50000
      backlog-poll-interval: 60s
  redis:
    capacity:
      monitoring-enabled: true
      memory-warning-ratio: 0.80
      memory-critical-ratio: 0.90
      poll-interval: 60s
  history-retention:
    enabled: true
    task-maximum-age: 30d
    audit-maximum-age: 365d
    config-maximum-age: 365d
    config-minimum-versions: 20
    batch-size: 500
    maximum-batches: 20
    cleanup-cron: 0 30 3 * * *
  storage:
    derived-orphan-scan:
      enabled: true
      delete-enabled: false
      prefix: ""
      minimum-age: 24h
      page-size: 500
      maximum-pages-per-run: 20
      maximum-deletes-per-run: 100
      cursor-ttl: 30d
      lock-ttl: 30m
      cleanup-cron: 0 15 4 * * *
  rate-limit:
    enabled: true
    default-limit: 120
    default-window: 60s
    key-prefix: omninest:rate-limit
  upload:
    url-ttl: 4h
    session-ttl: 24h
  aria2:
    poll-interval-seconds: 5
    rpc-timeout-seconds: 15
  clamav:
    timeout: 2000s
  rclone:
    connect-timeout-seconds: 10
    read-timeout-seconds: 300
    metadata-cache-ttl: 60m
  minio:
    api-call-timeout-seconds: 1800
    buckets:
      user-files: user-files
      derived-assets: derived-assets
      quarantine: file-quarantine
