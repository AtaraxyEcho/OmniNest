name: omninest
description: OmniNest Flutter client for Web, Android, and Desktop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  cached_network_image: ^4.0.4
  cached_network_image_platform_interface: ^5.0.3
  flutter_cache_manager: ^3.4.1
  dio: ^5.9.0
  file_picker: ^13.1.0
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4
  go_router: ^18.0.2
  json_annotation: ^4.9.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.3
  web: ^1.1.1
  flutter_soloud: ^5.1.5
  connectivity_plus: ^6.1.3
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  app_links: ^7.2.1
  image_picker: ^1.2.0
  flutter_local_notifications: ^22.3.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  stomp_dart_client: ^3.0.1
  geolocator: ^14.1.1
  animated_toggle_switch: 0.8.7
  drift: ^2.15.0
  sqlite3: ^3.3.2
  path_provider: ^2.1.0
  path: ^1.9.0
  screen_retriever: ^0.2.0
  window_manager: ^0.5.2
  tray_manager: ^0.7.0
  hotkey_manager: ^0.2.3
  flutter_tts: ^4.0.0
  html: ^0.15.0
  xml: ^7.1.0
  archive: ^4.2.0
  gbk_codec: ^0.4.0
  data_table_2: ^2.8.0
  intl: ^0.20.2
  # 显式钉住已迁 Built-in Kotlin 的传递依赖，避免旧插件把它们拖回 KGP 版本。
  package_info_plus: ^10.2.1
  wakelock_plus: ^1.8.0
  pro_image_editor: 13.3.1
  qr_flutter: ^4.1.0
  pdfrx: ^2.6.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  toastification: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  drift_dev: ^2.15.0
  build_runner: ^2.4.0
  # 图标生成是构建期工具，不进入应用运行时依赖。
  flutter_launcher_icons_plus: ^0.15.0

hooks:
  user_defines:
    sqlite3:
      # Android 7+ 的 linker namespace 禁止应用 dlopen 系统 libsqlite3.so，
      # 因此仅 Windows 链接系统 winsqlite3；其余平台用官方预编译 SQLite 捆绑。
      source:
        windows: system
      name:
        windows: winsqlite3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/backdrops/
    - assets/icon/
    - assets/images/
    - assets/pdfjs/
  shaders:
    - assets/shaders/portal_weather.frag
  fonts:
    # Noto Sans SC 使用单张可变字体：wght 轴覆盖 100-900，替代 4 张静态字面。
    # UI 无衬线字体按 GB2312 + 界面文案子集化（17.0MB → 3.9MB），由
    # tool/subset_cjk_fonts.py 生成；衬线字体保留全量以覆盖阅读器生僻字。
    # Flutter 3.41+ 会把 FontWeight 映射到变量轴，不要为每个字重重复声明同一文件。
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    # 衬线档只有 Regular 一张静态字面（该 OTF 无 fvar，不能按权重插值）。
    # 稿子的标题与面板名写 600，这里不补 SemiBold：为一个字重翻倍不成立。
    # 因此衬线档的层级一律靠字号、字距与行高表达，w600 声明保留
    # （补齐字面即生效，不必改代码）。
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    # Noto Sans SC、Inter 与 JetBrains Mono 均为 SIL OFL 1.1 许可，许可文本见 assets/fonts/OFL-*.txt
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf

flutter_launcher_icons_plus:
  # 全局默认图标：源图为 assets/icon/icon.png（1254x1254，深色底 #171b1a）
  image_path: "assets/icon/icon.png"   # Android 单独使用专用图标
  android: "launcher_icon"
  image_path_android: "assets/icon/icon.png"
  adaptive_icon_background: "#171b1a"
  adaptive_icon_foreground: "assets/icon/icon.png"
  ios: true
#  image_path_ios: "assets/icon/mobile_icon.png"
  image_path_ios: "assets/icon/icon.png"
  web:
    generate: true
#    image_path_web: "assets/icon/web_icon.png"
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    icon_size: 256   # 可填 48~256，建议保持 48 或 256
#    image_path_desktop: "assets/icon/desktop_icon.png"
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
#    image_path_desktop: "assets/icon/desktop_icon.png"
    image_path: "assets/icon/icon.png"
  linux:
    generate: true
#    image_path_desktop: "assets/icon/desktop_icon.png"
    image_path: "assets/icon/icon.png"
