name: omninest
description: OmniNest Flutter client for Web, Android, and Desktop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  cupertino_icons: ^1.0.9
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  dio: ^5.9.0
  file_picker: ^8.1.7
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  file_selector: ^1.0.3
  desktop_drop: ^0.7.1
  go_router: ^17.0.0
  json_annotation: ^4.9.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  carousel_slider: ^5.1.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.3
  web: ^1.1.1
  flutter_soloud: ^4.1.7
  photo_manager: ^3.6.1
  connectivity_plus: ^6.1.3
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  app_links: ^6.4.0
  image_picker: ^1.2.0
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.6.0
  device_info_plus: ^11.2.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  stomp_dart_client: ^3.0.1
  geolocator: ^13.0.2
  animated_toggle_switch: 0.8.7
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  screen_retriever: ^0.2.0
  window_manager: ^0.4.3
  tray_manager: ^0.3.1
  hotkey_manager: ^0.2.3
  flutter_tts: ^4.0.0
  html: ^0.15.0
  xml: ^6.6.1
  archive: ^3.6.1
  gbk_codec: ^0.4.0
  data_table_2: ^2.7.2
  intl: ^0.20.2
  pro_image_editor: 13.3.1
  qr_flutter: ^4.1.0
  flutter_launcher_icons_plus: ^0.15.0
  pdfrx: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.15.0
  build_runner: ^2.4.0
  sqlite3: ^3.3.2

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/backdrops/
    - assets/icon/
    - assets/images/
    - assets/pdfjs/
  shaders:
    - assets/shaders/portal_weather.frag
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-700.ttf
          weight: 700
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    # Inter 与 JetBrains Mono 均为 SIL OFL 1.1 许可，许可文本见 assets/fonts/OFL-*.txt
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400

flutter_launcher_icons_plus:
  # 全局默认图标
  image_path: "assets/icon/icon.png"   # 请替换为您的图标文件路径（推荐1024x1024 PNG）  # Android 单独使用专用图标
  android: "launcher_icon"
  image_path_android: "assets/icon/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon.png"
  ios: true
#  image_path_ios: "assets/icon/mobile_icon.png"
  image_path_ios: "assets/icon/icon.png"
  web:
    generate: true
#    image_path: "assets/icon/web_icon.png"
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
  windows:
    generate: true
    icon_size: 256   # 可填 48~256，建议保持 48 或 256
#    image_path: "assets/icon/desktop_icon.png"
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
#    image_path: "assets/icon/desktop_icon.png"
    image_path: "assets/icon/icon.png"
  linux:
    generate: true
#    image_path: "assets/icon/desktop_icon.png"
    image_path: "assets/icon/icon.png"
