org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 固定本机 JDK，避免 Android Studio/环境残留把错误 JAVA_HOME 传给 Gradle。
org.gradle.java.home=D\:\\Development\\JDK\\eclipse\\jdk-21
android.useAndroidX=true
# Pub 缓存与项目位于不同盘符时，Kotlin 增量缓存无法生成稳定的相对路径。
kotlin.incremental=false

# ── 以下两项为上游兼容层，条件满足后删除 ──────────────────────────
# skipDependencyChecks:
#   AGP 9.4.1 Built-in Kotlin = 2.2.10 < Flutter 3.47 DependencyVersionChecker
#   错误线 2.2.20。kotlin.version / kotlin_version 均无法覆盖 AGP 内置版本；
#   AGP 9 亦拒绝手动应用 org.jetbrains.kotlin.android。
#   移除条件：AGP Built-in Kotlin ≥ 2.2.20（预计 AGP 9.5+），删除此行后
#   执行 flutter build apk 验证无 "lower than Flutter's minimum" 报错。
skipDependencyChecks=true

# android.newDsl:
#   Flutter 3.47 flutter-gradle-plugin 将 android 扩展转型 AbstractAppExtension，
#   并调用已废弃的 applicationVariants；newDsl=true 时返回 ApplicationExtensionImpl
#   无法转型。share_plus / package_info_plus / wakelock_plus / flutter_tts 已适配
#   AGP 9（仅 agpMajor < 9 时 apply kotlin-android），不再是阻碍。
#   移除条件：flutter-gradle-plugin 迁移到 AndroidComponentsExtension 且不再依赖
#   AbstractAppExtension / applicationVariants（预计 Flutter 3.48+），删除此行后
#   执行 flutter build apk 验证无 ClassCastException。
#   注意：AGP 10 将强制 newDsl=true 并移除此开关，届时 Flutter 插件必须先迁完。
android.newDsl=false

# 抑制 AGP 9 对 newDsl/applicationVariants 的弃用警告（兼容层存在期间的噪音）。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
