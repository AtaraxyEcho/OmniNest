<!DOCTYPE html>
<html>
<head>
  <script src="js/omninest-boot.js"></script>

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniNest self-hosted personal digital life center.">
  <!-- 系统栏取色与移动端舞台底色一致（#0b1110），manifest 之外的旧浏览器兜底。
       浅色极性由下面的脚本在首帧前改写。 -->
  <meta name="theme-color" content="#0b1110" id="omninest-theme-color">
  <script>
    // 引擎首帧之前定色。运行期的 BrowserThemeColorBinding 要等第一帧之后才生效，
    // 浅色偏好用户在此之前看到的是深色系统栏与深色底。这里只能复现启动读取的
    // 规则：设备级偏好优先，缺省跟随系统极性；登录后的远端偏好仍由 Dart 侧覆盖。
    (function () {
      var LIGHT = '#e9eee7';
      var DARK = '#0b1110';
      var mode = 'system';
      try {
        // SharedPreferences 的 Web 实现用 json.encode 落盘，字符串带引号。
        var stored =
          window.localStorage.getItem('flutter.appearance.device.theme_mode') ||
          window.localStorage.getItem('flutter.global_theme_mode');
        if (typeof stored === 'string') {
          stored = JSON.parse(stored);
        }
        if (stored === 'light' || stored === 'dark' || stored === 'system') {
          mode = stored;
        }
      } catch (error) {
        // 禁用存储或隐私模式：按系统极性走。
      }
      var prefersLight =
        typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-color-scheme: light)').matches;
      var isLight = mode === 'light' || (mode === 'system' && prefersLight);
      var color = isLight ? LIGHT : DARK;
      window.__omninestInitialThemeColor = color;
      document
        .getElementById('omninest-theme-color')
        .setAttribute('content', color);
      if (isLight) {
        document.documentElement.style.setProperty(
          '--omninest-boot-bg',
          color
        );
      }
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OmniNest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniNest</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/omninest-shell.css">
  <script src="js/omninest-webgl.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
